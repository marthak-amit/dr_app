name: mediq
description: MediQ - high-fidelity clickable doctor appointment app prototype (mock data only).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  table_calendar: ^3.1.3
  fl_chart: ^0.69.2
  shimmer: ^3.0.0
  lottie: ^3.2.0
  intl: ^0.19.0
  flutter_svg: ^2.0.16
  smooth_page_indicator: ^1.2.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/doctors/
    - assets/images/clinics/
    - assets/images/illustrations/
    - assets/icons/
    - assets/lottie/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
